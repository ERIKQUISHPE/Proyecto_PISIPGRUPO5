<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/plantilla/plantillaui">

<head>
<meta charset="utf-8">
<title>GESTIÓN DE MATERIALES</title>
</head>

<body>
	<div layout:fragment="espaciopaginas">

		<h2>Lista de Materiales</h2>

		<a th:href="@{/materiales/nuevo}" class="btn-centronet"> <i
			class="material-symbols-outlined">build</i> Añadir Material
		</a>
		<div
			class="mdc-layout-grid_cell stretch-card mdc-layout-grid_cell--span-12">
			<div class="mdc-card p-0">
				<div class="table-responsive">
					<table class="table table-hover table-dark-mdc">
						<thead>
							<tr style="text-align: center;">
								<th>#</th>
								<th>Código</th>
								<th>Nombre</th>
								<th>Descripción</th>
								<th>Costo de compra</th>
								<th>Costo de venta</th>
								<th>Stock</th>
								<th>Proveedor</th>
								<th>Acciones</th>
							</tr>
						</thead>

						<tbody>
							<tr th:each="materialdato: ${listamaterial}">
								<td th:text="${materialdato.idMaterial}"></td>
								<td th:text="${materialdato.codigoMaterial}"></td>
								<td th:text="${materialdato.nombre}"></td>
								<td th:text="${materialdato.descripcion}"></td>
								<td th:text="${materialdato.costoCompra}"></td>
								<td th:text="${materialdato.costoVenta}"></td>
								<td th:text="${materialdato.stock}"></td>
								<td th:text="${materialdato.fkProveedor != null 
              and materialdato.fkProveedor.estado 
              ? materialdato.fkProveedor.proveedor 
              : 'PROVEEDOR ELIMINADO'}">
</td>
								<td>
						    <a th:href="@{/materiales/editar(idMaterial=${materialdato.idMaterial})}"
						       class="btn btn-sm btn-primary"
						       title="Editar">
						        <i class="fa-solid fa-pen-to-square"></i>
						    </a>
						
						    <a class="btn btn-danger btn-sm"
						       th:href="@{/materiales/eliminar(idMaterial=${materialdato.idMaterial})}"
						       onclick="return confirm('¿Eliminar este material?')"
						       title="Eliminar">
						        <i class="fa-solid fa-trash"></i>
						    </a>
</td>
</tr>

						</tbody>

					</table>
				</div>
			</div>
		</div>

	</div>
</body>

</html>

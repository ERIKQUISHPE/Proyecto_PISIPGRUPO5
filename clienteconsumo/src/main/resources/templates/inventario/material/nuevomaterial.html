<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/plantilla/plantillaui">

<head>
<style>
:root {
	--mdc-theme-primary: #fbc02d; /* amarillo */
}
</style>

<meta charset="utf-8">
<title>Nuevo Material</title>
</head>

<body>
	<div layout:fragment="espaciopaginas">

		<h2>
			<span class="material-icons">add_circle</span> <span
				th:text="${material.idMaterial != 0} ? 'Editar Material' : 'Añadir Material'"></span>
		</h2>

		<div th:if="${error}"
			style="margin: 10px 0; padding: 10px; border-radius: 10px; border: 1px solid #f1b6b6; background: #fdecec; color: #b00020;">
			<span th:text="${error}"></span>
		</div>

		<div th:if="${msg}"
			style="margin: 10px 0; padding: 10px; border-radius: 10px; border: 1px solid #b7e1c1; background: #eaf7ee; color: #0a7a2f;">
			<span th:text="${msg}"></span>
		</div>



		<form class="form-centronet" th:object="${material}"
			th:action="${material.idMaterial != 0} ? @{/materiales/actualizar/{id}(id=${material.idMaterial})} : @{/materiales/guardar}"
			method="post">

			<input type="hidden" th:field="*{idMaterial}" />

			<div class="form-group">
				<label>Código</label> <input type="text" class="form-control"
					th:field="*{codigoMaterial}" required>
			</div>

			<div class="form-group">
				<label>Nombre</label> <input type="text" class="form-control"
					th:field="*{nombre}" required>
			</div>

			<div class="form-group">
				<label>Descripción</label> <input type="text" class="form-control"
					th:field="*{descripcion}" required>
			</div>

			<div class="form-group">
				<label>Costo compra</label> <input type="number" step="0.01"
					class="form-control" th:field="*{costoCompra}" required>
			</div>

			<div class="form-group">
				<label>Costo venta</label> <input type="number" step="0.01"
					class="form-control" th:field="*{costoVenta}" required>
			</div>

			<div class="form-group">
				<label>Stock</label> <input type="number" class="form-control"
					th:field="*{stock}" min="0" required>
			</div>

			<div class="form-group">
				<label>Proveedor</label>

				<div
					style="display: flex; gap: 10px; align-items: center; margin: 10px 0 14px; flex-wrap: wrap;">

					<div id="selProveedorMdc" class="mdc-select"
						data-mdc-auto-init="MDCSelect" style="min-width: 280px; flex: 1;">
						<input type="hidden" id="selProveedor"
							th:field="*{fkProveedor.idProveedor}"> <i
							class="mdc-select__dropdown-icon"></i>
						<div class="mdc-select__selected-text"></div>

						<div class="mdc-select__menu mdc-menu-surface">
							<ul class="mdc-list">
								<li class="mdc-list-item mdc-list-item--selected" data-value="0"
									aria-selected="true">Seleccione un proveedor</li>

								<li th:each="p : ${listaproveedor}" class="mdc-list-item"
									th:attr="data-value=${p.idProveedor}" th:text="${p.proveedor}">
								</li>
							</ul>
						</div>

						<div class="mdc-line-ripple"></div>
					</div>

					<a id="btnAddProveedor"
						th:href="@{'/proveedores/nuevo?returnTo=' + ${returnToProveedor}}"
						class="btn-guardar"
						style="text-decoration: none; display: inline-flex; align-items: center; gap: 6px;">
						<span class="material-icons" style="font-size: 18px;">person_add</span>
						Añadir Proveedor
					</a>

				</div>
			</div>



			<div class="form-group">
				<label>Estado</label>

				<div class="form-check d-flex align-items-center gap-2 mt-2">
					<input class="form-check-input" type="checkbox" id="estadoCheck"
						th:field="*{estado}"> <label class="form-check-label mb-0"
						for="estadoCheck"> Activo </label>
				</div>
			</div>


			<div class="form-actions">

				<button type="submit" class="btn-centronet">
					<i class="fa fa-save"></i> <span
						th:text="${material.idMaterial != 0} ? 'Actualizar' : 'Guardar'"></span>
				</button>

				<a th:href="@{/materiales}" class="btn-outline"> <i
					class="fa fa-times"></i> Cancelar
				</a>

			</div>
		</form>

		<script>
  document.addEventListener("click", (e) => {
    const li = e.target.closest(".mdc-list-item");
    if (!li) return;
    const menu = li.closest(".mdc-select__menu");
    if (!menu) return;
    const select = menu.closest(".mdc-select");
    if (!select) return;
    if (select.id === "selProveedorMdc") {
      const v = (li.getAttribute("data-value") || "0").toString();
      const hidden = document.getElementById("selProveedor");
      if (hidden) hidden.value = v;
    }
  });
</script>

<script>
  const KEY = "materialDraft";

  function valByField(fieldName) {
    const el = document.querySelector("[name='" + fieldName + "']");
    return el ? (el.value ?? "") : "";
  }

  function setValByField(fieldName, v) {
    const el = document.querySelector("[name='" + fieldName + "']");
    if (el && (el.value === "" || el.value == null)) el.value = v ?? "";
  }

  function saveDraft() {
    const draft = {
      codigoMaterial: valByField("codigoMaterial"),
      nombre: valByField("nombre"),
      descripcion: valByField("descripcion"),
      costoCompra: valByField("costoCompra"),
      costoVenta: valByField("costoVenta"),
      stock: valByField("stock"),
      estado: document.getElementById("estadoCheck")?.checked ?? false,
      proveedorId: document.getElementById("selProveedor")?.value ?? "0"
    };

    sessionStorage.setItem(KEY, JSON.stringify(draft));
  }

  function restoreDraft() {
    const raw = sessionStorage.getItem(KEY);
    if (!raw) return;

    const idMaterial = valByField("idMaterial");
    if (idMaterial && idMaterial !== "0") return;

    const d = JSON.parse(raw);

    setValByField("codigoMaterial", d.codigoMaterial);
    setValByField("nombre", d.nombre);
    setValByField("descripcion", d.descripcion);
    setValByField("costoCompra", d.costoCompra);
    setValByField("costoVenta", d.costoVenta);
    setValByField("stock", d.stock);

    const chk = document.getElementById("estadoCheck");
    if (chk) chk.checked = d.estado;

    const hp = document.getElementById("selProveedor");
    if (hp && (hp.value === "" || hp.value === "0")) {
      hp.value = d.proveedorId ?? "0";
    }
  }

  document.addEventListener("DOMContentLoaded", () => {
    restoreDraft();

    const btn = document.getElementById("btnAddProveedor");
    if (btn) btn.addEventListener("click", saveDraft);

    const form = document.querySelector("form.form-centronet");
    if (form) {
      form.addEventListener("submit", () => {
        sessionStorage.removeItem(KEY);
      });
    }
  });
</script>

	</div>
</body>
</html>

<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="/plantilla/plantillaui">

<head>
  <meta charset="utf-8">
  <title>Reparación</title>

  <style>
    :root { --mdc-theme-primary: #fbc02d; }

    .select-beauty{
      width: 420px;
      max-width: 100%;
      padding: 10px 42px 10px 14px;
      border-radius: 14px;
      border: 1px solid #d6d6d6;
      background: #fff;
      outline: none;
      transition: .15s ease;
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      box-shadow: 0 1px 0 rgba(0,0,0,.03);
    }
    .select-beauty:focus{
      border-color: #fbc02d;
      box-shadow: 0 0 0 3px rgba(251,192,45,.25);
    }
    .select-wrap{
      position: relative;
      display: inline-block;
      width: 420px;
      max-width: 100%;
    }
    .select-wrap::after{
      content: "";
      position: absolute;
      right: 14px;
      top: 50%;
      width: 10px;
      height: 10px;
      border-right: 3px solid #333;
      border-bottom: 3px solid #333;
      transform: translateY(-55%) rotate(45deg);
      pointer-events: none;
      opacity: .7;
    }

    .rep-page{ max-width: 1100px; margin: 0 auto; }
    .rep-grid{ display: grid; grid-template-columns: 1fr; gap: 16px; }

    .rep-card{
      background: #fff;
      border: 1px solid #eee;
      border-radius: 14px;
      padding: 16px 16px;
      box-shadow: 0 1px 0 rgba(0,0,0,.03);
    }

    .rep-title{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }

    .form-group{ margin-bottom: 14px; }
    .form-group > label{ display:block; font-weight:700; margin-bottom:6px; }

    .form-control{ width:100%; border-radius:12px; }

    .mat-row{
      display: grid;
      grid-template-columns: 120px 1fr 70px 95px;
      gap: 8px;
      align-items: center;
      margin-top: 6px;
    }
    @media (max-width: 900px){
      .mat-row{ grid-template-columns: 1fr; align-items: start; }
    }

    .mat-check{ display:flex; align-items:center; gap:10px; white-space:nowrap; }
    .mat-check label{ font-weight: 600; }

    .qty{
      width: 40px;
      height: 40px;
      padding: 0;
      border-radius: 10px;
      border: 1px solid #d6d6d6;
      text-align: center;
      font-size: 14px;
      background: #fff;
      box-shadow: 0 1px 2px rgba(0,0,0,.05);
    }
    .qty:focus{
      border-color:#fbc02d;
      box-shadow:0 0 0 3px rgba(251,192,45,.25);
    }

    .btn-mini{
      padding: 9px 12px;
      border-radius: 12px;
      border: 1px solid #d6d6d6;
      background: #fff;
      cursor: pointer;
      height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn-mini:disabled{ opacity:.5; cursor:not-allowed; }

    .muted{ opacity:.7; font-size:13px; margin-top:8px; display:block; }

    .card-table{ border-radius:12px; overflow:hidden; border:1px solid #eee; }
    .table-modern-like{
      width:100%;
      border-collapse:collapse;
      margin:0;
      border:1px solid #dcdcdc;
    }
    .table-modern-like thead th{
      background:#9b948c;
      color:#111;
      padding:12px;
      text-align:left;
      font-weight:700;
      white-space:nowrap;
    }
    .table-modern-like tbody td{
      padding:12px;
      border-top:1px solid #ececec;
      background:#fff;
      vertical-align:middle;
      white-space:nowrap;
    }
    .table-modern-like tbody td:first-child{ white-space:normal; }

    .actions-bottom{
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid #f0f0f0;
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .select-wrap{ width:100%; }
    .select-beauty{ width:100%; }
  </style>
</head>

<body>
<div layout:fragment="espaciopaginas" class="rep-page">

  <h2 class="rep-title">
    <span class="material-icons"
          th:text="${idAccionEdit != null} ? 'edit' : 'add_circle'">add_circle</span>
    <span th:text="${idAccionEdit != null} ? 'Editar Reparación' : 'Añadir Reparación'">Añadir Reparación</span>
  </h2>

  <div th:if="${msg != null and !#strings.isEmpty(msg)}"
       class="alert alert-info"
       th:text="${msg}"></div>

  <form class="form-centronet"
        th:action="${idAccionEdit != null} ? @{/reparaciones/actualizar} : @{/reparaciones/guardar}"
        method="post"
        id="formReparacion">

    <input type="hidden" name="idAccion" th:value="${idAccionEdit != null} ? ${idAccionEdit} : ''">

    <input type="hidden" id="idOrdenInternaHidden" name="idOrdenInterna" value="">
    <input type="hidden" id="tecnicoIdHidden" name="tecnicoId" th:value="${tecnicoIdEdit != null} ? ${tecnicoIdEdit} : ''">

    <div class="rep-grid">
      <div class="rep-card">

        <div class="form-group">
          <label>Orden</label>

          <input th:if="${idAccionEdit != null}"
                 type="text"
                 class="form-control"
                 th:value="${textoOrdenEdit != null and !#strings.isEmpty(textoOrdenEdit)} ? ${textoOrdenEdit} : 'Orden seleccionada'"
                 readonly>

          <div th:if="${idAccionEdit == null}" class="select-wrap">
            <select class="select-beauty" id="ordenSelectUi" required>
              <option value="">Seleccione una orden</option>

              <option th:each="o : ${listaOrdenInternaDisponible}"
                      th:value="${o.idOrdenInterna}"
                      th:attr="data-tecnico-id=${o.tecnicoId},data-tecnico-nombre=${o.tecnicoNombre},data-tecnico-apellido=${o.tecnicoApellido}"
                      th:text="${o.textoOrden != null and !#strings.isEmpty(o.textoOrden)} ? ${o.textoOrden} : ('Orden Interna #' + ${o.idOrdenInterna})">
              </option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label>Técnico asignado</label>
          <input type="text"
                 class="form-control"
                 id="tecnicoNombreInput"
                 th:value="${ (tecnicoNombreEdit != null and !#strings.isEmpty(tecnicoNombreEdit))
                              ? (tecnicoNombreEdit + ' ' + (tecnicoApellidoEdit != null ? tecnicoApellidoEdit : ''))
                              : (tecnicoIdEdit != null ? ('ID ' + tecnicoIdEdit) : '') }"
                 placeholder="Se llena al elegir la orden"
                 readonly>
        </div>

        <div class="form-group">
          <label>Acción realizada</label>
          <input type="text"
                 class="form-control"
                 name="descripcion"
                 th:value="${reparacion != null} ? ${reparacion.descripcion} : ''"
                 placeholder="Ej: Cambio de pantalla, Formateo, etc"
                 required>
        </div>

        <div class="form-group">
          <label>Materiales usados</label>

          <div class="mat-row">
            <div class="mat-check">
              <input type="checkbox" id="chkMateriales">
              <label for="chkMateriales" style="margin:0;">Si/No</label>
            </div>

            <div class="select-wrap" style="width: 100%;">
              <select class="select-beauty" id="materialSelectUi" disabled style="width:100%;">
                <option value="">Elija un material</option>
                <option th:each="m : ${listamateriales}"
                        th:value="${m.idMaterial}"
                        th:text="${m.nombre}">
                </option>
              </select>
            </div>

            <input class="qty" type="number" min="1" value="1" id="cantidadUi" disabled>
            <button type="button" class="btn-mini" id="btnAgregarMat" disabled>Agregar</button>
          </div>

          <span class="muted">Si no marcas Si/No, no se guardan materiales</span>
        </div>

        <div class="mdc-layout-grid_cell stretch-card mdc-layout-grid_cell--span-12" style="margin-top: 10px;">
          <div class="mdc-card p-0 card-table">
            <div class="table-responsive">
              <table class="table-modern-like" id="tablaMateriales">
                <thead>
                  <tr>
                    <th>Materiales usados</th>
                    <th style="width:120px;">Cant</th>
                    <th style="width:110px;">Acción</th>
                  </tr>
                </thead>
                <tbody id="tbodyMateriales">
                  <tr id="rowEmpty">
                    <td colspan="3" class="muted">Aún no agregas materiales</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <div id="hiddenMateriales"></div>

        <!-- ✅ PASAR materialesEdit a JS -->
        <script th:if="${materialesEdit != null}" th:inline="javascript">
          window.__MATS_EDIT__ = /*[[${materialesEdit}]]*/ [];
        </script>

        <div class="actions-bottom">
          <button type="submit" class="btn-centronet">
            <i class="fa fa-save"></i>
            <span th:text="${idAccionEdit != null} ? 'Actualizar' : 'Guardar'">Guardar</span>
          </button>

          <a th:href="@{/reparaciones}" class="btn-outline">
            <i class="fa fa-times"></i> Cancelar
          </a>
        </div>

      </div>
    </div>

  </form>

  <script>
    document.addEventListener("DOMContentLoaded", () => {

      const form = document.getElementById("formReparacion")

      const ordenSelectUi = document.getElementById("ordenSelectUi")
      const idOrdenInternaHidden = document.getElementById("idOrdenInternaHidden")
      const tecnicoIdHidden = document.getElementById("tecnicoIdHidden")
      const tecnicoNombreInput = document.getElementById("tecnicoNombreInput")

      if (ordenSelectUi) {
        ordenSelectUi.addEventListener("change", () => {
          const val = (ordenSelectUi.value || "").trim()
          idOrdenInternaHidden.value = val

          if (!val) {
            tecnicoIdHidden.value = ""
            if (tecnicoNombreInput) tecnicoNombreInput.value = ""
            return
          }

          const opt = ordenSelectUi.options[ordenSelectUi.selectedIndex]
          const tecnicoId = (opt.getAttribute("data-tecnico-id") || "").trim()
          const tecNombre = (opt.getAttribute("data-tecnico-nombre") || "").trim()
          const tecApellido = (opt.getAttribute("data-tecnico-apellido") || "").trim()

          tecnicoIdHidden.value = tecnicoId

          if (tecnicoNombreInput) {
            const full = (tecNombre + " " + tecApellido).trim()
            tecnicoNombreInput.value = full ? full : (tecnicoId ? ("ID " + tecnicoId) : "")
          }
        })
      }

      const chk = document.getElementById("chkMateriales")
      const selMat = document.getElementById("materialSelectUi")
      const qty = document.getElementById("cantidadUi")
      const btnAdd = document.getElementById("btnAgregarMat")
      const tbody = document.getElementById("tbodyMateriales")
      const rowEmpty = document.getElementById("rowEmpty")
      const hiddenBox = document.getElementById("hiddenMateriales")

      function syncMateriales() {
        const enabled = chk && chk.checked
        if (selMat) selMat.disabled = !enabled
        if (qty) qty.disabled = !enabled
        if (btnAdd) btnAdd.disabled = !enabled
        if (!enabled) {
          if (selMat) selMat.value = ""
          if (qty) qty.value = 1
        }
      }

      if (chk) chk.addEventListener("change", syncMateriales)
      syncMateriales()

      function removeEmptyRowIfNeeded() {
        if (!tbody) return
        const hasRealRows = tbody.querySelectorAll("tr[data-key]").length > 0
        if (rowEmpty) rowEmpty.style.display = hasRealRows ? "none" : ""
      }

      function rebuildHidden() {
        if (!hiddenBox) return
        hiddenBox.innerHTML = ""

        const rows = tbody.querySelectorAll("tr[data-key]")
        rows.forEach(r => {
          const matId = r.getAttribute("data-mat-id")
          const cant = r.getAttribute("data-cant")

          const i1 = document.createElement("input")
          i1.type = "hidden"
          i1.name = "materialId"
          i1.value = matId

          const i2 = document.createElement("input")
          i2.type = "hidden"
          i2.name = "cantidad"
          i2.value = cant

          hiddenBox.appendChild(i1)
          hiddenBox.appendChild(i2)
        })
      }

      function addRow(matId, matName, cant) {
        if (!tbody) return

        const existing = tbody.querySelector(`tr[data-key][data-mat-id="${matId}"]`)
        if (existing) {
          const old = parseInt(existing.getAttribute("data-cant") || "1", 10)
          const nw = old + cant
          existing.setAttribute("data-cant", String(nw))
          existing.querySelector(".tdCant").innerText = String(nw)
          rebuildHidden()
          removeEmptyRowIfNeeded()
          return
        }

        const tr = document.createElement("tr")
        tr.setAttribute("data-key", "1")
        tr.setAttribute("data-mat-id", matId)
        tr.setAttribute("data-cant", String(cant))

        tr.innerHTML = `
          <td>${matName}</td>
          <td class="tdCant">${cant}</td>
          <td><button type="button" class="btn-mini btnDel">Quitar</button></td>
        `

        tr.querySelector(".btnDel").addEventListener("click", () => {
          tr.remove()
          rebuildHidden()
          removeEmptyRowIfNeeded()
        })

        tbody.appendChild(tr)
        rebuildHidden()
        removeEmptyRowIfNeeded()
      }

      if (btnAdd) {
        btnAdd.addEventListener("click", () => {

          if (!chk.checked) return

          const matId = (selMat.value || "").trim()
          if (!matId) {
            alert("Selecciona un material")
            return
          }

          const matName = selMat.options[selMat.selectedIndex].text
          let cant = parseInt((qty.value || "1"), 10)
          if (isNaN(cant) || cant <= 0) cant = 1

          addRow(matId, matName, cant)

          selMat.value = ""
          qty.value = 1
        })
      }

      if (form) {
        form.addEventListener("submit", (ev) => {
          const idOrd = (idOrdenInternaHidden.value || "").trim()

          const isEdit = !!document.querySelector('input[name="idAccion"][value]:not([value=""])')

          if (!isEdit && !idOrd) {
            ev.preventDefault()
            alert("Primero selecciona una orden")
            return
          }

          if (chk && !chk.checked && hiddenBox) {
            hiddenBox.innerHTML = ""
          }
        })
      }

      // ✅ AUTOLLENAR EN EDITAR
      try {
        if (window.__MATS_EDIT__ && Array.isArray(window.__MATS_EDIT__) && window.__MATS_EDIT__.length > 0) {

          chk.checked = true
          syncMateriales()

          window.__MATS_EDIT__.forEach(m => {
            const idMaterial = (m.idMaterial != null) ? String(m.idMaterial) : ""
            const nombre = (m.nombre != null) ? String(m.nombre) : ("Material ID " + idMaterial)
            const cantidad = parseInt(m.cantidad, 10) || 1
            if (idMaterial) addRow(idMaterial, nombre, cantidad)
          })
        }
      } catch (e) { }

      removeEmptyRowIfNeeded()
    })
  </script>

</div>
</body>
</html>

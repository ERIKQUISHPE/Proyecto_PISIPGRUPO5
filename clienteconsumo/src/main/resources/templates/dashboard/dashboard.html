<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="/plantilla/plantillaui">

<head>
  <meta charset="utf-8">
  <title>Dashboard</title>

  <style>

    .kpi-row{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:14px;
      margin-top:12px
    }

    @media(max-width:1100px){
      .kpi-row{grid-template-columns:repeat(2,1fr)}
    }

    .kpi{
      background:#fff;
      border:1px solid rgba(0,0,0,.08);
      border-radius:16px;
      padding:14px 16px;
      box-shadow:0 8px 18px rgba(0,0,0,.05);
      transition:.2s ease;
    }

    .kpi:hover{
      transform:translateY(-2px);
      box-shadow:0 14px 24px rgba(0,0,0,.08);
    }

    .kpi .label{
      font-size:12px;
      opacity:.7
    }

    .kpi .value{
      font-size:28px;
      font-weight:800;
      margin-top:6px
    }

    .dash-grid{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:16px;
      margin-top:20px
    }

    @media(max-width:1100px){
      .dash-grid{grid-template-columns:repeat(2,1fr)}
    }

    @media(max-width:700px){
      .dash-grid{grid-template-columns:1fr}
    }

    .dash-card{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:18px;
      border-radius:16px;
      border:1px solid rgba(0,0,0,.08);
      background:#fff;
      box-shadow:0 8px 18px rgba(0,0,0,.06);
      text-decoration:none;
      color:inherit;
      transition:.18s ease;
      min-height:96px;
      position:relative;
      overflow:hidden;
    }

    .dash-card:hover{
      transform:translateY(-3px);
      box-shadow:0 18px 30px rgba(0,0,0,.12);
    }

    .dash-card .title{
      font-weight:800;
      font-size:16px
    }

    .dash-card .desc{
      font-size:12px;
      opacity:.75;
      margin-top:4px
    }

    .dash-card .icon{
      width:56px;
      height:56px;
      border-radius:16px;
      display:grid;
      place-items:center;
      background:rgba(245,166,35,.15);
      flex:0 0 56px;
    }

    .dash-card .icon .material-icons{
      font-size:26px;
    }

    .badge-mini{
      display:inline-flex;
      align-items:center;
      gap:4px;
      margin-top:6px;
      padding:3px 8px;
      border-radius:999px;
      background:rgba(245,166,35,.15);
      font-size:11px;
      font-weight:600;
    }

    .chart-grid{
      display:grid;
      grid-template-columns:1.1fr 1fr;
      gap:16px;
      margin-top:22px
    }

    @media(max-width:1100px){
      .chart-grid{grid-template-columns:1fr}
    }

    .panel{
      background:#fff;
      border:1px solid rgba(0,0,0,.08);
      border-radius:16px;
      padding:16px;
      box-shadow:0 8px 18px rgba(0,0,0,.05)
    }

    .panel h4{
      margin:0 0 12px 0;
      font-size:16px;
      font-weight:700
    }

  </style>
</head>

<body>

<section layout:fragment="espaciopaginas">

  <h2>
    <span class="material-icons">dashboard</span>
    Dashboard
  </h2>

  <!-- KPIs -->
  <div class="kpi-row">

    <div class="kpi">
      <div class="label">Ingresados</div>
      <div class="value" th:text="${resumen.pendientes}">0</div>
    </div>

    <div class="kpi">
      <div class="label">En proceso de reparación</div>
      <div class="value" th:text="${resumen.diagnostico}">0</div>
    </div>

    <div class="kpi">
      <div class="label">Reparados / Entrega pendiente</div>
      <div class="value" th:text="${resumen.finalizados}">0</div>
    </div>

    <div class="kpi">
      <div class="label">Entregados</div>
      <div class="value" th:text="${resumen.entregados}">0</div>
    </div>

  </div>

  <div class="dash-grid">

    <a class="dash-card" th:href="@{/ordenes}">
      <div>
        <div class="title">Órdenes</div>
        <div class="desc">Crear y listar</div>

      </div>
      <div class="icon">
        <span class="material-icons">assignment</span>
      </div>
    </a>

    <a class="dash-card" th:href="@{/entregas}">
      <div>
        <div class="title">Entregas</div>
        <div class="desc">Cerrar servicio</div>
      </div>
      <div class="icon">
        <span class="material-icons">local_shipping</span>
      </div>
    </a>

    <a class="dash-card" th:href="@{/clientes}">
      <div>
        <div class="title">Clientes</div>
        <div class="desc">Buscar y gestionar</div>
      </div>
      <div class="icon">
        <span class="material-icons">people</span>
      </div>
    </a>

    <a class="dash-card" th:href="@{/pagos}">
      <div>
        <div class="title">Pagos</div>
        <div class="desc">Cobros</div>
      </div>
      <div class="icon">
        <span class="material-icons">payments</span>
      </div>
    </a>

  </div>

  <div class="chart-grid">

    <div class="panel">
      <h4>Órdenes por estado</h4>
      <canvas id="chartEstado" height="140"></canvas>
    </div>

    <div class="panel">
      <h4>Órdenes por mes</h4>
      <canvas id="chartMes" height="140"></canvas>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script th:inline="javascript">

    const estadoLabels = /*[[${estadoLabels}]]*/ [];
    const estadoValues = /*[[${estadoValues}]]*/ [];

    const mesLabels = /*[[${mesLabels}]]*/ [];
    const mesValues = /*[[${mesValues}]]*/ [];

    new Chart(document.getElementById("chartEstado"), {
      type: "pie",
      data: {
        labels: estadoLabels,
        datasets: [{
          data: estadoValues,
          borderWidth: 1
        }]
      },
      options:{
        responsive:true,
        plugins:{legend:{position:'bottom'}}
      }
    });

    new Chart(document.getElementById("chartMes"), {
      type:"bar",
      data:{
        labels: mesLabels,
        datasets:[{
          label:'Órdenes',
          data: mesValues,
          borderWidth:1
        }]
      },
      options:{
        responsive:true,
        scales:{y:{beginAtZero:true,ticks:{stepSize:1}}},
        plugins:{legend:{display:false}}
      }
    });

  </script>

</section>
</body>
</html>

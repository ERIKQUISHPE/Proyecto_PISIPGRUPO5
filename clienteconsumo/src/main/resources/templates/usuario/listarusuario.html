<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="/plantilla/plantillaui">

<head>
  <meta charset="utf-8">
  <title>Lista de Usuarios</title>
</head>

<body>
<div layout:fragment="espaciopaginas">

  <h2>Lista de Usuarios</h2>

  <a th:href="@{/usuarios/nuevo}" class="btn-centronet">
    <i class="fa-solid fa-user-plus"></i>
    Añadir Usuario
  </a>

  <div class="mdc-data-table table-dark-mdc" style="width:100%;">
    <div class="mdc-data-table__table-container">
      <table class="mdc-data-table__table" aria-label="Lista de Usuarios">
        <thead>
        <tr class="mdc-data-table__header-row">
          <th class="mdc-data-table__header-cell">ID</th>
          <th class="mdc-data-table__header-cell">Usuario</th>
          <th class="mdc-data-table__header-cell">Nombre</th>
          <th class="mdc-data-table__header-cell">Apellido</th>
          <th class="mdc-data-table__header-cell">Rol</th>
          <th class="mdc-data-table__header-cell">Teléfono</th>
          <th class="mdc-data-table__header-cell">Correo</th>
          <th class="mdc-data-table__header-cell">Estado</th>
          <th class="mdc-data-table__header-cell">Acciones</th>
        </tr>
        </thead>

        <tbody class="mdc-data-table__content">
        <tr class="mdc-data-table__row" th:each="usuariodato : ${listausuario}">
          <td class="mdc-data-table__cell" th:text="${usuariodato.idUsuario}"></td>
          <td class="mdc-data-table__cell" th:text="${usuariodato.usuario}"></td>
          <td class="mdc-data-table__cell" th:text="${usuariodato.nombre}"></td>
          <td class="mdc-data-table__cell" th:text="${usuariodato.apellido}"></td>
          <td class="mdc-data-table__cell" th:text="${usuariodato.rol}"></td>
          <td class="mdc-data-table__cell" th:text="${usuariodato.telefono}"></td>
          <td class="mdc-data-table__cell" th:text="${usuariodato.correo}"></td>

          <td class="mdc-data-table__cell"
              th:text="${usuariodato.estado} ? 'Activo' : 'Inactivo'"></td>

          <td class="mdc-data-table__cell">
            <a th:href="@{/usuarios/editar/{id}(id=${usuariodato.idUsuario})}"
               class="btn btn-sm btn-primary">
              <i class="fa-solid fa-pen-to-square"></i>
            </a>

            <a th:href="@{/usuarios/eliminar/{id}(id=${usuariodato.idUsuario})}"
               class="btn btn-sm btn-danger"
               onclick="return confirm('Seguro que deseas eliminar?');">
              <i class="fa-solid fa-trash"></i>
            </a>
          </td>
        </tr>
        </tbody>

      </table>
    </div>
  </div>

</div>
</body>
</html>
